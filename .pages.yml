# Pages CMS · charlymx.com
media:
  input: public/images
  output: /images

content:
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, category, date, draft]
      primary: title
      sort: [date, title]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Título, type: string, required: true }
      - { name: summary, label: Resumen, type: text, description: "1 o 2 líneas para tarjetas y redes" }
      - name: category
        label: Categoría
        type: select
        required: true
        options: { values: [Mi fé, IA, NFL, Flag football, Fútbol] }
      - { name: tags, label: Etiquetas, type: string, list: true }
      - { name: date, label: Fecha, type: date, required: true }
      - { name: cover, label: Imagen de portada, type: image, description: "WebP, 1600 px de ancho máximo" }
      - { name: featured, label: Destacado, type: boolean, default: false }
      - { name: draft, label: Borrador (no se publica), type: boolean, default: true }
      - { name: body, label: Contenido, type: rich-text }

  - name: proyectos
    label: Proyectos
    type: collection
    path: src/content/proyectos
    view:
      fields: [name, status, order]
      primary: name
      sort: [order]
    fields:
      - { name: name, label: Nombre, type: string, required: true }
      - { name: description, label: Descripción, type: text, required: true }
      - name: status
        label: Estado
        type: select
        required: true
        options: { values: [En vivo, Recién lanzado, Prototipo, Idea] }
      - { name: url, label: Enlace, type: string, description: "Vacío si aún no está en línea" }
      - { name: image, label: Imagen o logo, type: image, description: "Logo en SVG; capturas en WebP" }
      - { name: image_bg, label: Color de fondo del logo, type: string, description: "Opcional, ej. #eef6f3" }
      - { name: featured, label: Mostrar en Inicio, type: boolean, default: true }
      - { name: order, label: Orden, type: number }

  - name: inicio
    label: Inicio
    type: file
    path: src/data/inicio.json
    format: json
    fields:
      - { name: tag, label: Etiqueta superior, type: string }
      - { name: headline, label: Titular, type: string }
      - { name: highlight, label: Palabra en azul del titular, type: string }
      - { name: intro, label: Presentación, type: text }
      - name: photos
        label: Mazo de fotos
        type: object
        list: { min: 1, max: 6 }
        fields:
          - { name: image, label: Foto, type: image, description: "WebP, máximo 1200 px de ancho" }
          - { name: position, label: Encuadre, type: string, description: "Ej. 50% 30% (horizontal vertical)" }
          - { name: title, label: Etiqueta grande, type: string }
          - { name: caption, label: Pie de foto, type: string }
      - { name: show_sports, label: Mostrar sección "Mis equipos" (se edita en Mis equipos), type: boolean }

  - name: sobre-mi
    label: Sobre mí
    type: file
    path: src/data/sobre-mi.json
    format: json
    fields:
      - { name: headline, label: Titular, type: string }
      - { name: bio, label: Biografía, type: text, description: "Separa los párrafos con una línea en blanco" }
      - { name: photos, label: Fotos del encabezado, type: image, list: { max: 2 } }
      - name: passions
        label: Lo que me mueve
        type: object
        list: true
        fields:
          - { name: title, label: Título, type: string }
          - { name: text, label: Texto, type: text }
          - { name: image, label: Imagen, type: image }
          - { name: position, label: Encuadre, type: string }
          - { name: big, label: Tarjeta alta, type: boolean }

  - name: equipos
    label: Mis equipos
    type: file
    path: src/data/equipos.json
    format: json
    fields:
      - name: teams
        label: Equipos
        type: object
        list: true
        fields:
          - name: league
            label: Liga
            type: select
            required: true
            options: { values: [NFL, Liga MX, MLB, LMB] }
          - { name: name, label: Nombre, type: string, required: true, description: "Se lee como Mis {nombre}, ej. Rayados" }
          - { name: abbr, label: Abreviatura, type: string, required: true, description: "Ej. DEN, MTY. Se muestra si no hay escudo y sirve para encontrar al equipo en ESPN" }
          - { name: espn_id, label: ID del equipo (ESPN o MLB), type: string, description: "NFL y MLB: abreviatura en minúsculas (den, atl). Liga MX: número del equipo en ESPN (Rayados = 220). LMB: número del equipo en la API de MLB (Sultanes = 562)" }
          - { name: crest, label: Escudo, type: image, description: "SVG o WebP cuadrado, idealmente menos de 50 KB" }
          - { name: color, label: Color de fondo (hex), type: string, description: "Ej. #0b2c5f" }
          - { name: accent, label: Color de acento (hex), type: string, description: "Ej. #FB4F14" }
          - name: pattern
            label: Diseño de la franja
            type: select
            options: { values: [rayas, diagonal, liso] }
          - { name: url, label: Enlace oficial (opcional), type: string, description: "Solo para ligas sin datos en vivo; hoy ninguna lo necesita" }
          - { name: slug, label: Dirección de su página, type: string, required: true, description: "Ej. liga-mx → charlymx.com/liga-mx/" }

  - name: ajustes
    label: Ajustes del sitio
    type: file
    path: src/data/ajustes.json
    format: json
    fields:
      - { name: site_title, label: Nombre del sitio, type: string }
      - { name: description, label: Descripción para Google, type: text }
      - { name: whatsapp, label: WhatsApp (formato wa.me), type: string, description: "Sin + ni espacios, ej. 528115537660" }
      - { name: whatsapp_display, label: WhatsApp (como se muestra), type: string }
      - { name: whatsapp_message, label: Mensaje inicial de WhatsApp, type: string }
      - { name: facebook, label: Facebook (URL), type: string }
      - { name: instagram, label: Instagram (URL), type: string }
      - { name: x, label: X (URL), type: string }
      - { name: linkedin, label: LinkedIn (URL), type: string }
