<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>charlymx · En construcción</title>
<meta name="description" content="charlymx.com está en construcción. Volvemos pronto.">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#F2F2F2;--fg:#0A0A0A;--muted:#5C5C5C;--accent:#FFD400;--ink:#0A0A0A}
@media (prefers-color-scheme:dark){:root{--bg:#0A0A0A;--fg:#F2F2F2;--muted:#9C9C9C}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding-inline:20px}
header{padding-block:20px;font-weight:900;font-size:22px;letter-spacing:-.04em}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;max-width:1200px;width:100%;margin-inline:auto}
h1{margin:0;font-weight:900;font-size:clamp(44px,12.5vw,200px);line-height:.86;letter-spacing:-.06em;text-transform:uppercase;text-wrap:balance}
h1 span{background:var(--accent);color:var(--ink);padding-inline:.06em}
p{margin:0;max-width:40ch;font-size:clamp(17px,2.2vw,22px);color:var(--muted)}
.tape{margin-inline:-20px;height:28px;background:repeating-linear-gradient(-45deg,var(--accent) 0 18px,var(--ink) 18px 36px);background-size:51px 100%;animation:move 3s linear infinite}
@keyframes move{to{background-position:51px 0}}
@media (prefers-reduced-motion:reduce){.tape{animation:none}}
</style>
</head>
<body>
<header>charlymx</header>
<main>
  <h1>En <span>construcción</span></h1>
  <p>Estoy preparando algo nuevo. Vuelve pronto.</p>
</main>
<div class="tape" aria-hidden="true"></div>
</body>
</html>
